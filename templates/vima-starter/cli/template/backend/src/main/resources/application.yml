server:
  port: 8080

spring:
  application:
    name: vima-starter
  datasource:
    # PostgreSQL (默认)
    url: jdbc:postgresql://localhost:5432/vima
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: postgres
    # H2 (开发测试，取消注释切换)
    # url: jdbc:h2:mem:vima;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    # driver-class-name: org.h2.Driver
    # username: sa
    # password: 
    # MySQL (取消注释切换)
    # url: jdbc:mysql://localhost:3306/vima?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    # driver-class-name: com.mysql.cj.jdbc.Driver
    # username: root
    # password: root
    # 人大金仓 KingbaseES (信创，取消注释切换)
    # url: jdbc:kingbase8://localhost:54321/vima
    # driver-class-name: com.kingbase8.Driver
    # username: system
    # password: 123456
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    # PostgreSQL 方言
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    # H2 方言
    # database-platform: org.hibernate.dialect.H2Dialect
    # MySQL 方言
    # database-platform: org.hibernate.dialect.MySQLDialect
    # 人大金仓方言
    # database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  data:
    redis:
      host: localhost
      port: 6379
      password: 
      database: 0
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

jwt:
  secret: vima-starter-secret-key-must-be-at-least-256-bits-long-for-hs256!!
  expiration: 86400000

file:
  upload-dir: ./uploads
  base-url: http://localhost:8080
